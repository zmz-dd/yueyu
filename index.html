<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>粤语朗读考试助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: #f1f8e9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 12px;
            color: #2c3e2f;
            margin: 0;
            padding-bottom: 30px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { font-size: 1.5rem; background: linear-gradient(135deg, #2e7d32, #1b5e20); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 16px;
            background: #fff;
            border-radius: 50px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            color: #2e5c2a;
            text-align: center;
        }
        .tab-btn.active { background: #2e7d32; color: white; }
        .tab-pane {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .tab-pane.active { display: block; animation: fade 0.2s ease; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .card { background: #fff; border-radius: 20px; padding: 14px; margin-bottom: 16px; border: 1px solid #e8f5e9; }
        .card-title { font-weight: 700; font-size: 1rem; color: #1b5e20; border-left: 4px solid #66bb6a; padding-left: 10px; margin-bottom: 12px; }
        button { background: #4caf50; color: white; border: none; border-radius: 40px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        button:active { opacity: 0.7; }
        button.secondary { background: #ffb74d; }
        button.outline { background: transparent; border: 1.5px solid #4caf50; color: #2e7d32; }
        button.danger { background: #ef5350; }
        button.danger-outline { background: transparent; border: 1.5px solid #ef5350; color: #c62828; }
        input, textarea { width: 100%; padding: 12px; border-radius: 28px; border: 1px solid #c8e6c9; background: #fef9e6; font-size: 0.9rem; margin: 8px 0; font-family: monospace; }
        .word-list { max-height: 450px; overflow-y: auto; background: #f9fbe7; border-radius: 16px; padding: 8px; }
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #dcedc8;
            flex-wrap: wrap;
            gap: 6px;
        }
        .word-text { font-weight: 700; font-size: 1rem; min-width: 80px; }
        .jyutping-badge { background: #e1f5e8; padding: 3px 10px; border-radius: 30px; font-family: monospace; font-size: 0.7rem; }
        .progress-info { font-size: 0.75rem; background: #f1f8e9; padding: 10px; border-radius: 20px; }
        .quiz-area { background: #fff8e7; padding: 16px; border-radius: 24px; text-align: center; }
        .quiz-word { font-size: 2rem; font-weight: 800; background: #c8e6c9; display: inline-block; padding: 12px 24px; border-radius: 50px; margin: 10px 0; letter-spacing: 2px; }
        .options { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 20px 0; }
        .option-btn {
            background: #e0e0e0;
            color: #1a1a1a;
            padding: 12px 18px;
            border-radius: 50px;
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #a5d6a7;
            transition: all 0.1s;
            min-width: 100px;
        }
        .option-btn.selected-correct { background: #4caf50; color: white; border-color: #2e7d32; }
        .option-btn.selected-wrong { background: #ef5350; color: white; text-decoration: line-through; border-color: #c62828; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        @media (max-width: 480px) { .quiz-word { font-size: 1.5rem; } .tab-btn { font-size: 0.7rem; padding: 8px 0; } .option-btn { padding: 8px 12px; font-size: 0.75rem; min-width: 70px; } }
        footer { text-align: center; font-size: 0.6rem; color: #7b8a6f; margin: 16px 0; }
        .tts-status { background: #e8f5e9; padding: 8px 12px; border-radius: 20px; margin-top: 10px; font-size: 0.7rem; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .status-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; }
        .status-mastered { background: #c8e6c9; color: #2e7d32; }
        .status-strange { background: #ffcdd2; color: #c62828; }
        .status-learning { background: #fff3e0; color: #ef6c00; }
        .action-btn { padding: 4px 10px; font-size: 0.7rem; margin: 0 2px; }
        .task-header { background: #e8f5e9; padding: 8px 12px; border-radius: 16px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🗣️ 粤读考试助手</h1>
        <p>内置考试词汇 | 智能学习计划 | 陌生词本</p>
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="query">🔊 朗读</button>
        <button class="tab-btn" data-tab="library">📚 词库</button>
        <button class="tab-btn" data-tab="plan">📅 计划</button>
        <button class="tab-btn" data-tab="quiz">✍️ 练习</button>
        <button class="tab-btn" data-tab="strange">📖 陌生词</button>
    </div>

    <div id="query" class="tab-pane active">
        <div class="card">
            <div class="card-title">🔊 粤语朗读器</div>
            <input type="text" id="queryText" placeholder="输入词语" value="香港">
            <button id="speakBtn" style="width:100%">🗣️ 朗读</button>
            <div class="tts-status" id="ttsStatus">✅ TTS已就绪</div>
        </div>
        <div class="card">
            <div class="card-title">📖 文章朗读</div>
            <textarea id="articleText" rows="3" placeholder="粘贴考试文章"></textarea>
            <button id="speakArticleBtn" style="width:100%">🎙️ 朗读全文</button>
        </div>
    </div>

    <div id="library" class="tab-pane">
        <div class="card">
            <div class="flex-between">
                <div class="card-title">📋 考试词库 (<span id="wordCount">0</span>)</div>
                <button id="resetToExamBtn" class="outline" style="padding:6px 12px;">重置词库</button>
            </div>
            <div id="wordListContainer" class="word-list"><div class="loading">⏳ 正在加载词库...</div></div>
        </div>
    </div>

    <div id="plan" class="tab-pane">
        <div class="card">
            <div class="card-title">📅 考试倒计时</div>
            <input type="date" id="examDate" value="2026-07-15">
            <button id="setPlanBtn" style="width:100%">生成学习计划</button>
            <div id="planDisplay" class="progress-info" style="margin-top:10px;"></div>
        </div>
        <div class="card">
            <div class="card-title">📊 学习进度</div>
            <div id="progressStats" class="progress-info"></div>
            <button id="resetProgressBtn" class="outline" style="width:100%; margin-top:8px;">重置所有进度</button>
        </div>
        <div class="card">
            <div class="card-title">📝 今日学习任务</div>
            <div id="todayTaskContainer" class="word-list"></div>
        </div>
    </div>

    <div id="quiz" class="tab-pane">
        <div class="quiz-area">
            <div>🎧 粤拼选择题</div>
            <div id="quizWordDisplay" class="quiz-word">----</div>
            <div id="optionsContainer" class="options"></div>
            <div id="quizFeedback" style="font-size:0.85rem; font-weight:bold; margin:8px 0;"></div>
            <div class="row" style="justify-content:center; gap:10px;">
                <button id="playSoundQuizBtn">🔊 听发音</button>
                <button id="nextQuizBtn" class="secondary">⏩ 下一题</button>
            </div>
        </div>
    </div>

    <div id="strange" class="tab-pane">
        <div class="card">
            <div class="flex-between">
                <div class="card-title">📖 陌生词本 (<span id="strangeCount">0</span>)</div>
                <button id="clearAllStrangeBtn" class="danger-outline" style="padding:6px 12px;">清空陌生词</button>
            </div>
            <div id="strangeWordContainer" class="word-list"></div>
        </div>
    </div>
    <footer>📦 数据存储于本机 | 标记陌生词后可集中复习</footer>
</div>

<script>
    // ==================== TTS 发音函数 ====================
    let currentUtterance = null;
    
    function speakWithSystem(text) {
        return new Promise((resolve, reject) => {
            if (!window.speechSynthesis) {
                reject(new Error('当前环境不支持语音合成'));
                return;
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.85;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            try {
                const voices = window.speechSynthesis.getVoices();
                let cantoneseVoice = voices.find(v => v.lang === 'yue' || v.lang === 'zh-HK');
                if (cantoneseVoice) utterance.voice = cantoneseVoice;
            } catch(e) {}
            utterance.onend = () => { currentUtterance = null; resolve(true); };
            utterance.onerror = () => { currentUtterance = null; reject(new Error('语音播放失败')); };
            if (currentUtterance) window.speechSynthesis.cancel();
            currentUtterance = utterance;
            window.speechSynthesis.speak(utterance);
        });
    }
    
    async function speakCantonese(text) {
        if (!text || !text.trim()) return false;
        try {
            await speakWithSystem(text);
            return true;
        } catch(e) {
            alert('发音失败，请确保手机已安装粤语语音包');
            return false;
        }
    }
    
    function speakWithSelectedVoice(text) { speakCantonese(text); }

    // ==================== 数据管理 ====================
    let words = [];
    let nextId = 1;
    let strangeWordIds = [];  // 存储陌生词的ID
    const STORAGE_KEY = 'canto_trainer';
    const STRANGE_KEY = 'canto_strange';
    let quizLock = false;
    let currentQuizWord = null;
    let currentOptions = [];
    let currentPlan = { total: 0, perDay: 0, startIndex: 0 };

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify({words, nextId})); }
    function saveStrange() { localStorage.setItem(STRANGE_KEY, JSON.stringify(strangeWordIds)); }
    
    function loadStrange() {
        const stored = localStorage.getItem(STRANGE_KEY);
        if (stored) {
            try {
                strangeWordIds = JSON.parse(stored);
            } catch(e) { strangeWordIds = []; }
        } else {
            strangeWordIds = [];
        }
    }
    
    function toggleStrange(wordId) {
        const index = strangeWordIds.indexOf(wordId);
        if (index === -1) {
            strangeWordIds.push(wordId);
        } else {
            strangeWordIds.splice(index, 1);
        }
        saveStrange();
        if (document.getElementById('strangeWordContainer')) renderStrangeWords();
        if (document.getElementById('todayTaskContainer')) renderTodayTask();
        renderWordList();
    }
    
    function isStrange(wordId) { return strangeWordIds.includes(wordId); }
    
    function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    function renderWordList() {
        const c = document.getElementById('wordListContainer');
        if(!c) return;
        document.getElementById('wordCount').innerText = words.length;
        const displayWords = words.slice(0, 150);
        c.innerHTML = displayWords.map(w => {
            let statusClass = '', statusText = '';
            if (w.mastered) { statusClass = 'status-mastered'; statusText = '✓已掌握'; }
            else if (isStrange(w.id)) { statusClass = 'status-strange'; statusText = '⭐陌生词'; }
            else { statusClass = 'status-learning'; statusText = '📖学习中'; }
            return `
            <div class="word-item">
                <div class="word-text">${escapeHtml(w.word)}</div>
                <div class="jyutping-badge">${escapeHtml(w.jyutping)}</div>
                <div><span class="status-badge ${statusClass}">${statusText}</span></div>
                <div>
                    <button class="speak-word action-btn" data-word="${escapeHtml(w.word)}">🔊</button>
                    ${!w.mastered ? `<button class="mark-mastered action-btn" data-id="${w.id}">✓掌握</button>` : ''}
                    <button class="mark-strange action-btn" data-id="${w.id}" style="background:#ffcdd2;color:#c62828;">⭐陌生</button>
                </div>
            </div>`;
        }).join('');
        if(words.length > 150) c.innerHTML += '<div style="text-align:center;padding:8px;">... 共' + words.length + '个词条</div>';
        
        document.querySelectorAll('.speak-word').forEach(btn => btn.addEventListener('click', () => speakWithSelectedVoice(btn.dataset.word)));
        document.querySelectorAll('.mark-mastered').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const word = words.find(w => w.id === id);
                if (word && !word.mastered) {
                    word.mastered = true;
                    save();
                    renderWordList();
                    updateStats();
                    renderTodayTask();
                    if (document.getElementById('strangeWordContainer')) renderStrangeWords();
                }
            });
        });
        document.querySelectorAll('.mark-strange').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                toggleStrange(id);
                renderWordList();
                updateStats();
                renderTodayTask();
                if (document.getElementById('strangeWordContainer')) renderStrangeWords();
            });
        });
    }
    
    function renderStrangeWords() {
        const c = document.getElementById('strangeWordContainer');
        if(!c) return;
        const strangeWords = words.filter(w => isStrange(w.id));
        document.getElementById('strangeCount').innerText = strangeWords.length;
        if (strangeWords.length === 0) {
            c.innerHTML = '<div class="loading">🎉 暂无陌生词，继续加油！</div>';
            return;
        }
        c.innerHTML = strangeWords.map(w => `
            <div class="word-item">
                <div class="word-text">${escapeHtml(w.word)}</div>
                <div class="jyutping-badge">${escapeHtml(w.jyutping)}</div>
                <div>
                    <button class="speak-strange action-btn" data-word="${escapeHtml(w.word)}">🔊</button>
                    <button class="master-from-strange action-btn" data-id="${w.id}" style="background:#c8e6c9;">✓掌握</button>
                    <button class="remove-strange action-btn" data-id="${w.id}" style="background:#ffcdd2;">移出</button>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.speak-strange').forEach(btn => btn.addEventListener('click', () => speakWithSelectedVoice(btn.dataset.word)));
        document.querySelectorAll('.master-from-strange').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const word = words.find(w => w.id === id);
                if (word && !word.mastered) {
                    word.mastered = true;
                    save();
                }
                const idx = strangeWordIds.indexOf(id);
                if (idx !== -1) strangeWordIds.splice(idx, 1);
                saveStrange();
                renderStrangeWords();
                renderWordList();
                updateStats();
                renderTodayTask();
            });
        });
        document.querySelectorAll('.remove-strange').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const idx = strangeWordIds.indexOf(id);
                if (idx !== -1) strangeWordIds.splice(idx, 1);
                saveStrange();
                renderStrangeWords();
                renderWordList();
                renderTodayTask();
            });
        });
    }
    
    document.getElementById('clearAllStrangeBtn')?.addEventListener('click', () => {
        if (confirm('清空所有陌生词？')) {
            strangeWordIds = [];
            saveStrange();
            renderStrangeWords();
            renderWordList();
            renderTodayTask();
        }
    });
    
    function updateStats() {
        let total = words.length, mastered = words.filter(w=>w.mastered).length;
        let strange = strangeWordIds.length;
        document.getElementById('progressStats').innerHTML = `总词条 ${total} | ✅已掌握 ${mastered} | ⭐陌生词 ${strange} | 📖学习中 ${total-mastered-strange}`;
        let exam = document.getElementById('examDate').value;
        if(exam && total) {
            let today = new Date(); today.setHours(0,0,0,0);
            let examDate = new Date(exam);
            let diff = Math.ceil((examDate - today) / 86400000);
            let needToLearn = total - mastered;
            let perDay = diff > 0 ? Math.ceil(needToLearn / diff) : needToLearn;
            currentPlan = { total, perDay, startIndex: 0 };
            if(diff > 0) document.getElementById('planDisplay').innerHTML = `距离考试还有 ${diff} 天<br>🎯 建议每天学习 ${perDay} 个新词<br>📊 当前未掌握: ${needToLearn} 个 (含陌生词 ${strange} 个)`;
            else document.getElementById('planDisplay').innerHTML = `⚠️ 考试日期已过！剩余 ${needToLearn} 个词条需要掌握`;
        }
    }
    
    function renderTodayTask() {
        const container = document.getElementById('todayTaskContainer');
        if (!container) return;
        let total = words.length, mastered = words.filter(w=>w.mastered).length;
        let notMastered = words.filter(w => !w.mastered);
        if (notMastered.length === 0) {
            container.innerHTML = '<div class="loading">🎉 恭喜！所有词条已掌握！</div>';
            return;
        }
        let exam = document.getElementById('examDate').value;
        let today = new Date(); today.setHours(0,0,0,0);
        let examDate = new Date(exam);
        let diff = Math.ceil((examDate - today) / 86400000);
        let perDay = diff > 0 ? Math.ceil(notMastered.length / diff) : notMastered.length;
        perDay = Math.min(perDay, 30); // 每天最多30个，避免页面过长
        let todayWords = notMastered.slice(0, perDay);
        
        container.innerHTML = `<div class="task-header">📌 今日任务 (${todayWords.length} / ${notMastered.length} 个待掌握词)</div>`;
        container.innerHTML += todayWords.map(w => {
            let isStrangeFlag = isStrange(w.id);
            return `
            <div class="word-item">
                <div class="word-text">${escapeHtml(w.word)}</div>
                <div class="jyutping-badge">${escapeHtml(w.jyutping)}</div>
                <div><span class="status-badge ${isStrangeFlag ? 'status-strange' : 'status-learning'}">${isStrangeFlag ? '⭐陌生词' : '📖学习中'}</span></div>
                <div>
                    <button class="task-speak action-btn" data-word="${escapeHtml(w.word)}">🔊</button>
                    <button class="task-master action-btn" data-id="${w.id}" style="background:#c8e6c9;">✓掌握</button>
                    <button class="task-strange action-btn" data-id="${w.id}" style="background:#ffcdd2;">⭐陌生</button>
                </div>
            </div>`;
        }).join('');
        
        document.querySelectorAll('.task-speak').forEach(btn => btn.addEventListener('click', () => speakWithSelectedVoice(btn.dataset.word)));
        document.querySelectorAll('.task-master').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const word = words.find(w => w.id === id);
                if (word && !word.mastered) {
                    word.mastered = true;
                    save();
                    updateStats();
                    renderTodayTask();
                    renderWordList();
                    if (document.getElementById('strangeWordContainer')) renderStrangeWords();
                }
            });
        });
        document.querySelectorAll('.task-strange').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                toggleStrange(id);
                updateStats();
                renderTodayTask();
                renderWordList();
                if (document.getElementById('strangeWordContainer')) renderStrangeWords();
            });
        });
    }
    
    document.getElementById('setPlanBtn')?.addEventListener('click', () => {
        updateStats();
        renderTodayTask();
    });
    
    function refreshQuiz() {
        if(!words.length) return;
        let pool = words.filter(w => !w.mastered);
        if(pool.length === 0) pool = words;
        currentQuizWord = pool[Math.floor(Math.random()*pool.length)];
        let opts = [currentQuizWord.jyutping];
        let others = [...new Set(words.filter(w=>w.id!==currentQuizWord.id).map(w=>w.jyutping))];
        while(opts.length<4 && others.length) { let r = others.shift(); if(!opts.includes(r)) opts.push(r); }
        for(let i=opts.length-1;i>0;i--) { let j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
        currentOptions = opts;
        document.getElementById('quizWordDisplay').innerHTML = escapeHtml(currentQuizWord.word);
        let div = document.getElementById('optionsContainer');
        div.innerHTML = '';
        currentOptions.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if(quizLock) return;
                if(opt === currentQuizWord.jyutping) {
                    if(!currentQuizWord.mastered) { 
                        currentQuizWord.mastered = true; 
                        save(); 
                        updateStats(); 
                        renderTodayTask();
                        renderWordList();
                        if (document.getElementById('strangeWordContainer')) renderStrangeWords();
                    }
                    document.getElementById('quizFeedback').innerHTML = '✅ 正确！继续加油！';
                    quizLock = true;
                    btn.classList.add('selected-correct');
                } else {
                    document.getElementById('quizFeedback').innerHTML = `❌ 错误！正确答案：${currentQuizWord.jyutping}<br>⭐可标记为陌生词重点复习`;
                    quizLock = true;
                    btn.classList.add('selected-wrong');
                }
            };
            div.appendChild(btn);
        });
        quizLock = false;
    }
    
    function refreshToday() { renderTodayTask(); }

    // 初始化词库
    function initData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored && stored !== '{}') {
            try {
                const data = JSON.parse(stored);
                words = data.words || [];
                nextId = data.nextId || 1;
                words.forEach(w => { if(w.mastered===undefined) w.mastered=false; });
            } catch(e) { loadFromBuiltin(); }
        } else {
            loadFromBuiltin();
        }
        loadStrange();
        renderWordList();
        updateStats();
        refreshToday();
        refreshQuiz();
        if (document.getElementById('strangeWordContainer')) renderStrangeWords();
    }
    
    function loadFromBuiltin() {
        if(typeof BUILTIN_WORDS !== 'undefined' && BUILTIN_WORDS.length > 0) {
            words = BUILTIN_WORDS.map((w, index) => ({
                id: index + 1,
                word: w[0],
                jyutping: w[1],
                mastered: false
            }));
            nextId = words.length + 1;
            save();
        } else {
            document.getElementById('wordListContainer').innerHTML = '<div class="loading">❌ 词库加载失败</div>';
        }
    }

    // 事件绑定
    document.getElementById('resetToExamBtn')?.addEventListener('click', () => { 
        if(confirm('重置词库？当前进度将丢失！')) { 
            loadFromBuiltin(); 
            strangeWordIds = [];
            saveStrange();
            renderWordList(); 
            updateStats(); 
            refreshToday(); 
            refreshQuiz();
            if (document.getElementById('strangeWordContainer')) renderStrangeWords();
        } 
    });
    document.getElementById('resetProgressBtn')?.addEventListener('click', () => { 
        if(confirm('重置所有学习进度？')){ 
            words.forEach(w=>w.mastered=false); 
            strangeWordIds = [];
            saveStrange();
            save(); 
            updateStats(); 
            refreshToday(); 
            refreshQuiz();
            renderWordList();
            if (document.getElementById('strangeWordContainer')) renderStrangeWords();
        } 
    });
    document.getElementById('speakBtn')?.addEventListener('click', () => speakWithSelectedVoice(document.getElementById('queryText').value));
    document.getElementById('speakArticleBtn')?.addEventListener('click', () => { let a = document.getElementById('articleText').value; if(a) speakWithSelectedVoice(a); else alert('请输入内容'); });
    document.getElementById('playSoundQuizBtn')?.addEventListener('click', () => { if(currentQuizWord) speakWithSelectedVoice(currentQuizWord.word); });
    document.getElementById('nextQuizBtn')?.addEventListener('click', () => refreshQuiz());

    // 选项卡切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
            document.getElementById(btn.dataset.tab).classList.add('active');
            if(btn.dataset.tab === 'library') renderWordList();
            if(btn.dataset.tab === 'plan') { updateStats(); refreshToday(); }
            if(btn.dataset.tab === 'quiz') refreshQuiz();
            if(btn.dataset.tab === 'strange') renderStrangeWords();
        });
    });
    
    if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }
    }
    
    function waitForWords() {
        if(typeof BUILTIN_WORDS !== 'undefined') {
            initData();
        } else {
            setTimeout(waitForWords, 100);
        }
    }
    waitForWords();
</script>
<script src="words_data.js"></script>
</body>
</html>
